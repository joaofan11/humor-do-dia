<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Como você está hoje?</title>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#ece8f7;--ink:#2a2750;--soft:#6b678f;--card:#fff;--line:#d6d0ec}
@media(prefers-color-scheme:dark){:root{--bg:#1d1b38;--ink:#f1eefc;--soft:#a9a4cf;--card:#2a2750;--line:#3d3a6b}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.5;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0)}
main{max-width:640px;margin:0 auto;padding:28px 18px 60px}
h1{font-size:clamp(2rem,8vw,3rem);line-height:1.05;font-weight:800;margin:0 0 6px;letter-spacing:-.02em}
.sub{color:var(--soft);margin:0 0 22px}
.tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:4px;margin-bottom:24px}
.tabs button{flex:1;border:0;background:none;color:var(--soft);font:inherit;font-weight:600;padding:9px;border-radius:999px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ink);color:var(--bg)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
@media(min-width:520px){.grid{grid-template-columns:repeat(3,1fr)}}
.mood{border:2px solid transparent;background:var(--card);border-radius:20px;padding:0;cursor:pointer;font:inherit;color:inherit;overflow:hidden;text-align:center;transition:transform .15s}
.mood:hover{transform:translateY(-2px)}
.mood .pic{aspect-ratio:1;display:grid;place-items:center;font-size:3.4rem;background:var(--c)}
.mood img{width:100%;height:100%;object-fit:cover;display:block}
.mood .lbl{display:block;padding:10px 6px;font-weight:600}
.mood[aria-pressed=true]{border-color:var(--ink);box-shadow:0 0 0 3px var(--c)}
textarea{width:100%;margin-top:18px;border:1px solid var(--line);border-radius:14px;background:var(--card);color:var(--ink);font:inherit;padding:12px;resize:vertical;min-height:70px}
.send{width:100%;margin-top:12px;border:0;border-radius:14px;background:var(--ink);color:var(--bg);font:inherit;font-weight:800;padding:14px;cursor:pointer}
.send:disabled{opacity:.35;cursor:not-allowed}
:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
.msg{margin-top:12px;font-weight:600;min-height:1.5em}
.now{background:var(--c);border-radius:26px;overflow:hidden;color:#2a2750}
.now .pic{aspect-ratio:16/10;display:grid;place-items:center;font-size:6rem}
.now img{width:100%;height:100%;object-fit:cover}
.now .info{padding:16px 20px 20px;background:var(--card);color:var(--ink)}
.now h2{margin:0;font-size:1.7rem}
.now p{margin:4px 0 0;color:var(--soft)}
.hist{list-style:none;padding:0;margin:26px 0 0}
.hist li{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.hist .e{font-size:1.6rem}
.hist small{color:var(--soft);display:block}
.warn{background:var(--card);border:1px dashed var(--soft);border-radius:12px;padding:10px 14px;margin-bottom:18px;font-size:.9rem}
.empty{color:var(--soft)}
[hidden]{display:none!important}
</style>
</head>
<body>
<main>
  <h1>Como você está hoje?</h1>
  <p class="sub">Escolha a carinha (ou o meme) que mais combina com agora.</p>

  <div id="warn" class="warn" hidden>Modo teste: os humores ficam só neste aparelho. Configure o Firebase no código para ele ver o seu.</div>

  <div class="tabs" role="tablist">
    <button role="tab" id="t-escolher" aria-selected="true">Escolher</button>
    <button role="tab" id="t-ver" aria-selected="false">Ver humor</button>
  </div>

  <section id="v-escolher">
    <div class="grid" id="grid"></div>
    <textarea id="note" placeholder="Quer contar mais alguma coisa? (opcional)" maxlength="200"></textarea>
    <button class="send" id="send" disabled>Enviar meu humor</button>
    <div class="msg" id="msg" role="status"></div>
  </section>

  <section id="v-ver" hidden>
    <div id="now"></div>
    <ul class="hist" id="hist"></ul>
  </section>
</main>

<script type="module">
// 1) Cole aqui a configuração do Firebase (veja o passo a passo). Deixe null para testar sem backend.
const FIREBASE_CONFIG = null;
/* Exemplo:
const FIREBASE_CONFIG = {
  apiKey: "...", authDomain: "...", projectId: "...", appId: "..."
};
*/

// 2) Os humores. Para usar memes/fotos, coloque os arquivos na pasta img/ com o nome do "id"
//    (ex.: img/feliz.jpg). Se a imagem não existir, aparece o emoji.
const MOODS = [
  {id:"feliz",      emoji:"😄", label:"Radiante",           c:"#ffd166"},
  {id:"apaixonada", emoji:"🥰", label:"Apaixonada",         c:"#ff8fab"},
  {id:"tranquila",  emoji:"😌", label:"De boa",             c:"#8fd6b0"},
  {id:"cansada",    emoji:"😴", label:"Sem energia",        c:"#9db4ff"},
  {id:"ansiosa",    emoji:"😵‍💫", label:"Ansiosa",           c:"#c3a6ff"},
  {id:"fome",       emoji:"🍕", label:"Com fome",           c:"#ffb36b"},
  {id:"triste",     emoji:"🥺", label:"Precisando de colo", c:"#7fb0d9"},
  {id:"estressada", emoji:"😤", label:"Estressada",         c:"#ff9966"},
  {id:"irritada",   emoji:"😡", label:"Não mexe comigo",    c:"#f06a6a"}
];
const IMG_EXT = "jpg"; // troque para png/webp se preferir

const $ = s => document.querySelector(s);
const byId = id => MOODS.find(m => m.id === id) || MOODS[0];
let db = null, fs = null, selected = null;

async function init(){
  if(FIREBASE_CONFIG){
    const {initializeApp} = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js");
    fs = await import("https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js");
    db = fs.getFirestore(initializeApp(FIREBASE_CONFIG));
  } else {
    $("#warn").hidden = false;
  }
}

function pic(m, cls){
  const d = document.createElement("div");
  d.className = cls;
  d.style.setProperty("--c", m.c);
  const img = new Image();
  img.alt = m.label;
  img.src = `img/${m.id}.${IMG_EXT}`;
  img.onload = () => { d.textContent = ""; d.appendChild(img); };
  d.textContent = m.emoji;
  return d;
}

function renderGrid(){
  const g = $("#grid");
  MOODS.forEach(m => {
    const b = document.createElement("button");
    b.className = "mood";
    b.style.setProperty("--c", m.c);
    b.setAttribute("aria-pressed", "false");
    b.appendChild(pic(m, "pic"));
    const l = document.createElement("span");
    l.className = "lbl"; l.textContent = m.label;
    b.appendChild(l);
    b.onclick = () => {
      selected = m.id;
      g.querySelectorAll(".mood").forEach(x => x.setAttribute("aria-pressed", x === b));
      $("#send").disabled = false;
    };
    g.appendChild(b);
  });
}

async function save(entry){
  if(db){ await fs.addDoc(fs.collection(db, "humores"), entry); return; }
  const list = JSON.parse(localStorage.getItem("humores") || "[]");
  list.unshift(entry);
  localStorage.setItem("humores", JSON.stringify(list.slice(0, 30)));
}

async function load(){
  if(db){
    const q = fs.query(fs.collection(db, "humores"), fs.orderBy("ts", "desc"), fs.limit(30));
    return (await fs.getDocs(q)).docs.map(d => d.data());
  }
  try { return JSON.parse(localStorage.getItem("humores") || "[]"); } catch { return []; }
}

const fmt = ts => new Date(ts).toLocaleString("pt-BR", {weekday:"short", day:"2-digit", month:"2-digit", hour:"2-digit", minute:"2-digit"});

async function renderVer(){
  const list = await load();
  const now = $("#now"), hist = $("#hist");
  now.textContent = ""; hist.textContent = "";
  if(!list.length){
    now.innerHTML = '<p class="empty">Ainda não chegou nenhum humor hoje.</p>';
    return;
  }
  const last = list[0], m = byId(last.mood);
  const card = document.createElement("div");
  card.className = "now"; card.style.setProperty("--c", m.c);
  card.appendChild(pic(m, "pic"));
  const info = document.createElement("div");
  info.className = "info";
  const h = document.createElement("h2"); h.textContent = m.label;
  const t = document.createElement("p"); t.textContent = fmt(last.ts);
  info.append(h, t);
  if(last.note){ const n = document.createElement("p"); n.style.color = "var(--ink)"; n.textContent = "“" + last.note + "”"; info.appendChild(n); }
  card.appendChild(info);
  now.appendChild(card);
  list.slice(1).forEach(e => {
    const mm = byId(e.mood), li = document.createElement("li");
    const em = document.createElement("span"); em.className = "e"; em.textContent = mm.emoji;
    const box = document.createElement("div");
    box.textContent = mm.label;
    const s = document.createElement("small");
    s.textContent = fmt(e.ts) + (e.note ? " — " + e.note : "");
    box.appendChild(s);
    li.append(em, box);
    hist.appendChild(li);
  });
}

function tab(name){
  ["escolher", "ver"].forEach(n => {
    $("#v-" + n).hidden = n !== name;
    $("#t-" + n).setAttribute("aria-selected", n === name);
  });
  if(name === "ver") renderVer();
  history.replaceState(null, "", name === "ver" ? "#ver" : "#");
}

$("#t-escolher").onclick = () => tab("escolher");
$("#t-ver").onclick = () => tab("ver");

$("#send").onclick = async () => {
  if(!selected) return;
  const btn = $("#send"), msg = $("#msg");
  btn.disabled = true; msg.textContent = "Enviando…";
  try {
    await save({mood: selected, note: $("#note").value.trim(), ts: Date.now()});
    msg.textContent = "Humor enviado!";
    $("#note").value = "";
  } catch (e) {
    msg.textContent = "Não deu para enviar. Tente de novo.";
    btn.disabled = false;
  }
};

renderGrid();
init().then(() => { if(location.hash === "#ver") tab("ver"); });
</script>
</body>
</html>
